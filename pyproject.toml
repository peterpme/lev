[project]
name = "lev"
version = "0.1.0"
description = "Educational typed decision model built on a small Qwen base"
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.15.0",
    "datasets==5.0.1",
    "numpy>=2.5.3",
    "peft>=0.15",
    "pydantic>=2.7",
    "scikit-learn>=1.9.1",
    "torch>=2.6,<2.9",
    "transformers>=4.51,<4.58",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.0",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
